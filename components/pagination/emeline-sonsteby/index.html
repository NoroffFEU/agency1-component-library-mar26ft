<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagination</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="pagination">
      <nav class="pagination-bar">
        <button class="page-btn prev-btn" id="prev-btn" aria-label="Previous page"></button>
        <div class="page-numbers-container" id="page-numbers-container"></div>
        <button class="page-btn next-btn" id="next-btn" aria-label="Next page"></button>
      </nav>
    </div>
    <script src="script.js"></script>
  </body>
</html>
