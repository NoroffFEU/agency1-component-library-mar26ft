<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter Dropdown</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <div class="dropdown">
        <button class="dropdown__trigger" type="button" aria-expanded="false">
          Colors
          <span class="dropdown__arrow">&#9662;</span>
        </button>
        <ul class="dropdown__menu">
          <li class="dropdown__item">
            <input id="white" type="checkbox" />
            <label for="white">White</label>
          </li>
          <li class="dropdown__item">
            <input id="black" type="checkbox" />
            <label for="black">Black</label>
          </li>
          <li class="dropdown__item">
            <input id="red" type="checkbox" />
            <label for="red">Red</label>
          </li>
          <li class="dropdown__item">
            <input id="blue" type="checkbox" />
            <label for="blue">Blue</label>
          </li>
          <li class="dropdown__item">
            <input id="yellow" type="checkbox" />
            <label for="yellow">Yellow</label>
          </li>
          <li class="dropdown__item">
            <input id="green" type="checkbox" />
            <label for="green">Green</label>
          </li>
        </ul>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
